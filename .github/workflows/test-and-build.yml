name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '**/*.rs'
      - '!scripts/**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'crates/katana-ui/Info.plist'
      - '.github/workflows/**'
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'gate' }}
  cancel-in-progress: true

# Restrict default GITHUB_TOKEN permissions (Task 7.3 hardening).
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test and Build
    # WHY: Draft PRでは重い検査を起動せず、pushとReady PRだけを実行する。
    if: >-
      github.event_name == 'push' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    # 全テストを維持し、巨大なOffice/V8依存のデバッグ情報だけでrunnerを満杯にしない。
    env:
      RUST_TEST_THREADS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_STRIP: none
      CARGO_PROFILE_TEST_STRIP: none
      KATANA_TEST_INVENTORY_ROOT: target/test-inventory/${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # - name: Validate Branch Name
      #   if: github.base_ref == 'master'
      #   shell: bash
      #   run: |
      #     BRANCH="${{ github.head_ref }}"
      #     if [[ ! "$BRANCH" =~ ^release/ && ! "$BRANCH" =~ ^hotfix/ && ! "$BRANCH" =~ ^dependabot/ ]]; then
      #       echo "Error: Only 'release/*', 'hotfix/*' or 'dependabot/*' branches can be merged into master."
      #       exit 1
      #     fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python for Windows inventory
        if: runner.os == 'Windows'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Install just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
          fallback: none

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # WHY: 取得元とコンパイル成果物を分離し、検査結果を再利用しない。
      - name: Cache Windows Cargo registry
        id: windows_registry_cache
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Identify Windows compiled target
        id: windows_target_identity
        if: runner.os == 'Windows'
        shell: bash
        run: >-
          python3 -B scripts/ci/windows_target_cache_identity.py --repo .
          --profile test --selection ci-test --github-output "$GITHUB_OUTPUT"

      # WHY: 同一source/toolchainだけを許可し、識別不能なら通常のfresh buildへ戻す。
      - name: Cache Windows compiled target
        id: windows_target_cache
        if: runner.os == 'Windows' && steps.windows_target_identity.outputs.cache_eligible == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/debug
            target/.rustc_info.json
          key: ${{ steps.windows_target_identity.outputs.cache_key }}

      - name: Cache Cargo registry & target
        if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-no-debug-info-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-no-debug-info-v1-

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev gcc pkg-config libdbus-1-dev mesa-vulkan-drivers vulkan-tools

      - name: Verify software Vulkan adapter (Linux)
        if: runner.os == 'Linux'
        run: |
          lvp_icd="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)"
          test -n "${lvp_icd}"
          LIBGL_ALWAYS_SOFTWARE=1 VK_DRIVER_FILES="${lvp_icd}" vulkaninfo --summary

      - name: Check types
        run: cargo check --workspace

      - name: Verify CI resource contract
        shell: bash
        run: |
          python3 -B -m unittest discover -s scripts/ci -p test_ci_resource_contract.py -v
          python3 -B -m unittest discover -s scripts/ci -p test_native_profiler_job_contract.py -v
          python3 -B -m unittest discover -s scripts/ci -p test_observe_ci_command.py -v
          python3 -B -m unittest discover -s scripts/ci -p test_windows_ci_observation_contract.py -v
          python3 -B -m unittest discover -s scripts/ci -p test_compare_windows_cache_measurements.py -v
          python3 -B -m unittest discover -s scripts/ci -p test_windows_compiled_cache_contract.py -v
          python3 -B -m unittest discover -s scripts/ci -p test_windows_shell_entry_contract.py -v
          python3 -B -m unittest discover -s scripts/ci -p test_observe_compiled_cache.py -v
          python3 -B -m unittest discover -s scripts/release -p test_windows_target_cache_identity.py -v
          python3 -B -m unittest discover -s scripts/runner -p test_impacted.py -v

      - name: Verify native inventory pipes (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python3 -B -W error::ResourceWarning -m unittest discover -s scripts/release -p test_native_test_pipe_reader.py -v
          python3 -B -W error::ResourceWarning -m unittest discover -s scripts/release -p test_native_test_run_recording.py -v

      - name: Install cargo-sweep
        run: |
          cargo install cargo-sweep --version 0.8.0 --locked
          cargo sweep --version

      - name: Verify Cargo sweep safety contract
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            KATANA_GUARD_BASH_EXECUTABLE="$(cygpath -w "$BASH")"
            export KATANA_GUARD_BASH_EXECUTABLE
          fi
          python3 -B -m unittest discover -s scripts/ci -p 'test_cargo_*guard.py' -v

      - name: Measure cold real-font lookup (Windows)
        if: runner.os == 'Windows'
        env:
          DEBUG: 'true'
        run: >-
          cargo test --locked -p katana-ui --lib
          preview_pane::document_surface::font_lookup::tests::real_background_worker_returns_result_with_identity_while_ui_paints
          -- --exact --nocapture

      - name: Test CommonMark cache contracts
        run: cargo test --locked -p katana-ui -p egui_commonmark_backend --lib lazy_highlighting_tests

      - name: Test CommonMark HTML trace bounds
        run: just test-commonmark-html-trace

      - name: Test patched custom cursor cache
        run: cargo test --locked -p katana-ui -p egui-winit --lib cursor_cache::tests

      - name: Test patched native surface size contracts
        run: just test-wgpu-native-surface-size

      - name: Run tests
        id: workspace_tests
        shell: bash
        env:
          KATANA_HTML_FAILURE_SAMPLE: ${{ runner.os == 'macOS' && '1' || '0' }}
          KATANA_TEST_INVENTORY_OUTPUT: ${{ env.KATANA_TEST_INVENTORY_ROOT }}/normal.json
          WINDOWS_REGISTRY_CACHE_HIT: ${{ steps.windows_registry_cache.outputs.cache-hit }}
          WINDOWS_TARGET_CACHE_HIT: ${{ steps.windows_target_cache.outputs.cache-hit }}
          WINDOWS_TARGET_CACHE_KEY: ${{ steps.windows_target_identity.outputs.cache_key }}
          WINDOWS_TARGET_CACHE_ELIGIBLE: ${{ steps.windows_target_identity.outputs.cache_eligible }}
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            BASH_EXECUTABLE="$(cygpath -w "$BASH")"
            python3 -B scripts/ci/observe-ci-command.py \
              --output "${KATANA_TEST_INVENTORY_ROOT}/windows-timing.json" \
              --cache-hit "${WINDOWS_REGISTRY_CACHE_HIT}" \
              --compiled-cache-hit "${WINDOWS_TARGET_CACHE_HIT}" \
              --compiled-cache-key "${WINDOWS_TARGET_CACHE_KEY}" \
              --compiled-cache-eligible "${WINDOWS_TARGET_CACHE_ELIGIBLE}" \
              -- "$BASH_EXECUTABLE" scripts/ci/with-office-test-worker.sh 'cargo test --workspace'
          else
            bash scripts/ci/with-office-test-worker.sh 'cargo test --workspace'
          fi

      - name: Upload original HTML failure sample (macOS)
        if: failure() && runner.os == 'macOS' && steps.workspace_tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: original-html-failure-sample-${{ runner.os }}
          path: target/html-startup-failures
          if-no-files-found: warn

      # WHY: 通常検査の失敗を維持し、描画phaseの診断だけを別実行へ隔離する。
      - name: Trace failed HTML startup (macOS)
        if: failure() && runner.os == 'macOS' && steps.workspace_tests.outcome == 'failure'
        shell: bash
        env:
          DEBUG: 'true'
        run: >-
          bash scripts/ci/with-office-test-worker.sh
          'cargo test --locked -p katana-ui --lib
          app::action::html_navigation::tests::file_navigation_to_an_open_dirty_target_preserves_target_state
          -- --exact --nocapture'

      - name: Test screenshot harness contracts
        if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
        shell: bash
        env:
          CARGO_TARGET_DIR: target/screenshot-harness
        run: cargo test --locked --release --manifest-path scripts/screenshot/Cargo.toml

      - name: Run multi-format headless acceptance
        if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            export LIBGL_ALWAYS_SOFTWARE=1
            export VK_DRIVER_FILES
            VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)"
            export WGPU_BACKEND=vulkan
          fi
          scripts/screenshot/run.sh \
            --request scripts/screenshot/examples/v0-22-38-multi-format-documents.json \
            --output "target/multi-format-headless-${{ runner.os }}"

      - name: Upload multi-format headless evidence
        if: always() && (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-format-headless-${{ runner.os }}
          path: target/multi-format-headless-${{ runner.os }}
          if-no-files-found: error

      - name: Install coverage tool
        if: runner.os == 'macOS' && (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      - name: Run coverage
        if: runner.os == 'macOS' && (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'))
        env:
          KATANA_TEST_INVENTORY_DIRECTORY: ${{ env.KATANA_TEST_INVENTORY_ROOT }}/coverage
        run: |
          rustup component add llvm-tools-preview
          JOBS=1 just coverage

      - name: Compare observed test inventory diagnostics
        if: always() && runner.os == 'macOS'
        run: python3 -B scripts/release/compare-test-invocations.py --directory "$KATANA_TEST_INVENTORY_ROOT"

      - name: Upload observed test inventory diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-inventory-${{ runner.os }}
          path: ${{ env.KATANA_TEST_INVENTORY_ROOT }}
          if-no-files-found: warn

  lint:
    name: Lint
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev gcc pkg-config libdbus-1-dev

      - name: Install Rust toolchain with clippy and rustfmt
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install just
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
          fallback: none

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # WHY: compiled targetを共有せず、lintも現在のsourceから実行する。
      - name: Cache Windows Cargo registry
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache Cargo registry & target
        if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        if: runner.os == 'Linux'
        run: just fmt-check

      - name: Run linter
        run: just lint

  supply-chain:
    name: Dependency Supply Chain
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check advisories, licenses, and sources
        run: bash scripts/ci/check-supply-chain.sh

  # CodeQL security scanning (Task 7.2 / 7.3).
  codeql:
    name: CodeQL Security Scan
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # Required to upload SARIF results.
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          queries: security-extended

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev gcc pkg-config libdbus-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache Cargo registry & target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-codeql-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-codeql-

      - name: Auto-build
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
