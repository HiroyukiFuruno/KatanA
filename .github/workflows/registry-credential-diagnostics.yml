name: Registry credential diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.actor == 'HiroyukiFuruno' && github.repository == 'HiroyukiFuruno/KatanA' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read fixed registry credential metadata
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 -B scripts/release/probe_registry_credential.py --output tmp/registry-credential-probe.json
      - name: Preserve safe credential diagnosis
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registry-credential-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/registry-credential-probe.json
          if-no-files-found: error
