# =============================================================================
# KatanA Desktop — Release CD
# =============================================================================
# Fully automated multi-platform release pipeline.
#
# Triggers:
#   1. release/vX.Y.Z branch merged into master  ← primary flow
#   2. Push of a version tag (v*)                ← legacy/emergency
#   3. Manual dispatch via `gh workflow run`     ← one-off/hotfix
#
# Flow (merge trigger):
#   1. preflight: Extract version from branch name → validate → extract release notes
#   2. build_{macos,linux,windows}: Build platform artifacts
#   3. publish: Create GitHub Release (tag + artifacts) via API, update Homebrew/Winget
#
# Security:
#   - Only the repository owner can trigger this workflow (filtered in preflight)
#   - Fork PRs will NOT trigger this workflow
# =============================================================================

name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read
  discussions: write

on:
  pull_request:
    types: [closed]
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - '.gitignore'
      - 'openspec/**'
      - 'docs/**'
      - 'evidence/**'
      - 'Justfile'
      - 'just/**'
      - 'scripts/**'
      - 'platforms/**'
      - '.vscode/**'
      - '.agent/**'
      - '.agents/**'
      - '.github/**'
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.18.1 or v0.18.1)'
        required: true
      force:
        description: 'Force overwrite existing release/tag'
        required: false
        default: false
        type: boolean
      reuse_existing_version:
        description: 'Release an already-merged version without changing version files'
        required: false
        default: false
        type: boolean

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    name: Preflight Check
    runs-on: macos-latest
    # WHY: For PR merges, only trigger when a release/v* branch is merged into master
    if: |
      github.actor == 'HiroyukiFuruno' && (
        github.event_name == 'workflow_dispatch' ||
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.merged == true &&
          startsWith(github.event.pull_request.head.ref, 'release/v'))
      )
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_bare: ${{ steps.version.outputs.version_bare }}
      commit_sha: ${{ steps.bump.outputs.commit_sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.ref }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          ./scripts/release/get-version.sh \
            "$EVENT_NAME" \
            "$INPUT_VERSION" \
            "$RELEASE_HEAD" \
            "$RELEASE_REF" \
            "$GITHUB_OUTPUT"

      - name: Verify CI gate for version bump merge
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release/verify-version-bump-ci.sh "${{ github.event.pull_request.merge_commit_sha }}"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install release validation tools
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.9.1
          fallback: none

      - name: Install native hook contract tools
        run: brew install lefthook just

      - name: Cache Cargo registry & build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-preflight-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-preflight-

      - name: Bump version and push
        id: bump
        # WHY: A failed artifact publication must be replayable without mutating its merged source.
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.reuse_existing_version != 'true')
        run: |
          ./scripts/release/bump-version.sh "${{ steps.version.outputs.version_bare }}"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run release preflight logic
        # WHY: check-pr-ready が preflight を内包するため、同じ公開検査を二重実行しない。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.version.outputs.version_bare }}" == "0.22.42" ]]; then
            ./scripts/release/check-pr-ready.sh "${{ steps.version.outputs.version_bare }}" --automated-release
          else
            ./scripts/release/check-pr-ready.sh "${{ steps.version.outputs.version_bare }}" --release-artifact-pending
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          scripts/release/extract-notes.sh "${{ steps.version.outputs.version }}" > RELEASE_NOTES.md
          echo "--- Release notes for ${{ steps.version.outputs.version }} ---"
          cat RELEASE_NOTES.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build_macos:
    name: Build macOS
    needs: preflight
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install cargo-bundle
        # WHY: install-action v2.85.7 does not support cargo-bundle 0.11.0.
        run: cargo install cargo-bundle --version 0.11.0 --locked
      - name: Install DMG tooling
        run: brew install create-dmg
      - name: Clean stale DMG files
        run: |
          STALE_DIR="$RUNNER_TEMP/katana-stale-release-assets"
          mkdir -p "$STALE_DIR" target/release
          find target/release -maxdepth 1 -name 'KatanA-Desktop-*.dmg' \
            -exec mv {} "$STALE_DIR/" \;
      - name: Build macOS .app
        run: scripts/build/package-mac.sh "${{ needs.preflight.outputs.version_bare }}"
      - name: Codesign .app
        run: |
          APP_PATH=$(find target/release/bundle/osx -name "*.app" -maxdepth 1 | head -1)
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --verbose "$APP_PATH"
      - name: Build .dmg installer
        run: scripts/build/dmg.sh "${{ needs.preflight.outputs.version_bare }}"
      - name: Build .zip archive
        run: |
          APP_PATH=$(find target/release/bundle/osx -name "*.app" -maxdepth 1 | head -1)
          if [[ -n "$APP_PATH" ]]; then
            ZIP_PATH="$PWD/target/release/KatanA-macOS.zip"
            STALE_DIR="$RUNNER_TEMP/katana-stale-release-assets"
            mkdir -p "$STALE_DIR"
            if [[ -e "$ZIP_PATH" ]]; then
              mv "$ZIP_PATH" "$STALE_DIR/"
            fi
            ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
            echo "Successfully built $ZIP_PATH"
          else
            exit 1
          fi
      - name: Verify macOS asset contract
        run: scripts/release/check-release-asset-contract.sh macos
      - name: Record generated macOS payload identity
        if: needs.preflight.outputs.version_bare == '0.22.42'
        run: |
          python3 scripts/release/record-generated-artifact-identity.py --root . --platform macos --main "target/release/bundle/osx/KatanA Desktop.app/Contents/MacOS/KatanA" --worker "target/release/bundle/osx/KatanA Desktop.app/Contents/MacOS/kdv-office-worker" --asset target/release/KatanA-macOS.zip --asset target/release/KatanA-Desktop-0.22.42.dmg --output tmp/identity-macos.json
      - name: Upload generated macOS payload identity
        if: needs.preflight.outputs.version_bare == '0.22.42'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-identity-macos
          path: tmp/identity-macos.json
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-macos
          path: |
            target/release/KatanA-Desktop-*.dmg
            target/release/KatanA-macOS.zip

  smoke_macos:
    name: Smoke macOS (${{ matrix.arch }})
    needs: [preflight, build_macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            mode: macos-arm64
          - arch: x86_64
            runner: macos-15-intel
            mode: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
      - name: Download universal macOS artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-macos
          path: artifacts-macos
      - name: Native clean-runner startup smoke
        run: |
          APP_DIR="$RUNNER_TEMP/katana-macos-smoke"
          mkdir -p "$APP_DIR"
          ditto -x -k artifacts-macos/KatanA-macOS.zip "$APP_DIR"
          cd "$APP_DIR"
          "$GITHUB_WORKSPACE/scripts/release/smoke-launch-packaged-app.sh" \
            "${{ matrix.mode }}" \
            "$APP_DIR/KatanA Desktop.app/Contents/MacOS/KatanA"

  build_linux:
    name: Build Linux
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-0 libssl-dev gcc pkg-config libdbus-1-dev mesa-vulkan-drivers vulkan-tools xvfb
      - name: Verify software Vulkan adapter
        run: |
          lvp_icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)
          test -n "$lvp_icd"
          test -f "$lvp_icd"
          LIBGL_ALWAYS_SOFTWARE=1 VK_DRIVER_FILES="$lvp_icd" WGPU_BACKEND=vulkan \
            xvfb-run -a vulkaninfo --summary
      - name: Build release (Linux)
        run: cargo build --workspace --release
      - name: Package Linux Artifact
        run: scripts/build/package-linux.sh
      - name: Verify Linux asset contract
        run: scripts/release/check-release-asset-contract.sh linux
      - name: Record generated Linux payload identity
        if: needs.preflight.outputs.version_bare == '0.22.42'
        run: |
          python3 scripts/release/record-generated-artifact-identity.py --root . --platform linux --main target/release/KatanA --worker target/release/kdv-office-worker --asset target/release/KatanA-linux-x86_64.tar.gz --output tmp/identity-linux.json
      - name: Upload generated Linux payload identity
        if: needs.preflight.outputs.version_bare == '0.22.42'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-identity-linux
          path: tmp/identity-linux.json
      - name: Smoke launch packaged Linux app
        id: linux_startup_smoke
        run: |
          lvp_icd=$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)
          test -n "$lvp_icd"
          test -f "$lvp_icd"
          export LIBGL_ALWAYS_SOFTWARE=1 VK_DRIVER_FILES="$lvp_icd" WGPU_BACKEND=vulkan
          TEMP_DIR=$(mktemp -d -t katana-linux-smoke.XXXXXX)
          tar -xzf target/release/KatanA-linux-x86_64.tar.gz -C "$TEMP_DIR"
          cd "$TEMP_DIR"
          "$GITHUB_WORKSPACE/scripts/release/smoke-launch-packaged-app.sh" linux-x86_64 "$TEMP_DIR/KatanA"
      - name: Upload Linux startup diagnostics
        if: failure() && steps.linux_startup_smoke.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-startup-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/trash/*-startup.*/heartbeat.txt
            tmp/trash/*-startup.*/startup.log
          if-no-files-found: error
      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-linux
          path: target/release/KatanA-linux-x86_64.tar.gz

  build_windows:
    name: Build Windows
    needs: preflight
    runs-on: windows-latest
    outputs:
      startup_smoke_outcome: ${{ steps.windows_startup_smoke.outcome }}

    steps:
      - name: Preserve source bytes for artifact provenance
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release (Windows)
        run: cargo build --workspace --release

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # main

      - name: Package Windows Artifacts
        shell: bash
        run: scripts/build/package-windows.sh

      - name: Verify Windows asset contract
        shell: bash
        run: scripts/release/check-release-asset-contract.sh windows
      - name: Record generated Windows payload identity
        if: needs.preflight.outputs.version_bare == '0.22.42'
        shell: bash
        run: |
          python scripts/release/record-generated-artifact-identity.py --root . --platform windows --main target/release/KatanA.exe --worker target/release/kdv-office-worker.exe --asset KatanA-windows-x86_64.zip --asset KatanA-windows-x86_64.msi --output tmp/identity-windows.json
      - name: Upload generated Windows payload identity
        if: needs.preflight.outputs.version_bare == '0.22.42'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-identity-windows
          path: tmp/identity-windows.json

      - name: Smoke launch packaged Windows app
        id: windows_startup_smoke
        shell: pwsh
        run: |
          $archive = Join-Path $PWD "KatanA-windows-x86_64.zip"
          $directory = Join-Path $env:RUNNER_TEMP "katana-windows-smoke"
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          $heartbeat = New-TemporaryFile
          $log = New-TemporaryFile
          $stdoutLog = New-TemporaryFile
          $diagnostics = Join-Path $env:RUNNER_TEMP ("katana-windows-startup-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $diagnostics -ErrorAction Stop | Out-Null
          "diagnostics_directory=$diagnostics" >> $env:GITHUB_OUTPUT
          $config = Join-Path $directory "empty-workspace-config"
          New-Item -ItemType Directory -Path $config -Force | Out-Null
          $env:KATANA_CONFIG_DIR = $config
          $env:KATANA_STARTUP_HEARTBEAT = $heartbeat.FullName
          $env:DEBUG = "true"
          $env:RUST_LOG = "warn,katana_ui=info,katana_core=info,KatanA=info,eframe::native::run=trace,eframe::native::wgpu_integration=trace,egui_wgpu=debug,winit::platform_impl::windows::event_loop=trace"
          $expectedExecutable = (Resolve-Path -LiteralPath (Join-Path $directory "KatanA.exe") -ErrorAction Stop).ProviderPath
          $expectedSha256 = (Get-FileHash -LiteralPath $expectedExecutable -Algorithm SHA256 -ErrorAction Stop).Hash
          $process = Start-Process -FilePath $expectedExecutable -WorkingDirectory $directory -PassThru -RedirectStandardOutput $stdoutLog.FullName -RedirectStandardError $log.FullName
          try {
            function Assert-PackagedProcessIdentity {
              $actualProcess = Get-Process -Id $process.Id -ErrorAction Stop
              if ([string]::IsNullOrWhiteSpace($actualProcess.Path)) {
                throw "Cannot determine packaged process executable path"
              }
              $actualExecutable = (Resolve-Path -LiteralPath $actualProcess.Path -ErrorAction Stop).ProviderPath
              if (-not [string]::Equals($actualExecutable, $expectedExecutable, [StringComparison]::OrdinalIgnoreCase)) {
                throw "Packaged process image path mismatch: expected=$expectedExecutable; actual=$actualExecutable"
              }
              $actualSha256 = (Get-FileHash -LiteralPath $actualExecutable -Algorithm SHA256 -ErrorAction Stop).Hash
              if ($actualSha256 -ne $expectedSha256) {
                throw "Packaged process image hash changed during smoke test"
              }
            }
            function Get-HeartbeatFrame {
              param([string]$Path)
              foreach ($attempt in 1..3) {
                $content = [string](Get-Content $Path -Raw -ErrorAction SilentlyContinue)
                $frameMatch = [regex]::Match($content, '(?m)^frame=(\d+)$')
                if ($content -match '(?m)^first-frame$' -and $frameMatch.Success) {
                  return [int64]$frameMatch.Groups[1].Value
                }
                Start-Sleep -Milliseconds 50
              }
              return $null
            }
            $ready = $false
            $initialFrame = $null
            foreach ($attempt in 1..40) {
              $initialFrame = Get-HeartbeatFrame $heartbeat.FullName
              if ($null -ne $initialFrame) { $ready = $true; break }
              if ($process.HasExited) { throw "Packaged app exited before first frame. Log: $(Get-Content $log.FullName -Raw)" }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw "Packaged app did not reach first frame. Log: $(Get-Content $log.FullName -Raw)" }
            Assert-PackagedProcessIdentity

            $lastFrame = $initialFrame

            $peakRss = 0L
            foreach ($attempt in 1..10) {
              if ($process.HasExited) { throw "Packaged app exited while waiting for UI progress. Log: $(Get-Content $log.FullName -Raw)" }
              Start-Sleep -Milliseconds 200
              $currentFrame = Get-HeartbeatFrame $heartbeat.FullName
              if ($null -eq $currentFrame -or $currentFrame -le $lastFrame) {
                throw "UI heartbeat stalled after first frame: last_frame=$lastFrame; current_frame=$currentFrame. Log: $(Get-Content $log.FullName -Raw)"
              }
              $lastFrame = $currentFrame
              $rss = (Get-Process -Id $process.Id).WorkingSet64
              if ($rss -gt $peakRss) { $peakRss = $rss }
            }
            if ($peakRss -gt 512MB) { throw "Empty-workspace RSS exceeds 512 MiB: $peakRss bytes" }
            if (Get-Process -Name "kdv-office-worker" -ErrorAction SilentlyContinue) {
              throw "Office worker is live in an empty workspace"
            }

            $logContent = Get-Content $log.FullName -Raw
            if ($logContent -notmatch 'event=ui_fonts_loaded .*owned_bytes=([0-9]+)') {
              throw "UI-owned font metric was not emitted. Log: $logContent"
            }
            $fontBytes = [int64]$Matches[1]
            if ($fontBytes -gt 134217728) { throw "UI-owned fonts exceed 128 MiB: $fontBytes bytes" }
            Assert-PackagedProcessIdentity
            Write-Host "packaged_identity_verified=true; executable=$expectedExecutable; sha256=$expectedSha256; pid=$($process.Id); last_frame=$lastFrame"
            Write-Host "Packaged app made continued UI progress; peak_rss_bytes=$peakRss; font_bytes=$fontBytes; office_workers=0"
          }
          catch {
            $startupFailure = $_
            try {
              $heartbeatItem = Get-Item -LiteralPath $heartbeat.FullName -ErrorAction Continue
              if ($null -ne $heartbeatItem) {
                Write-Host "Windows startup heartbeat metadata:"
                $heartbeatItem | Select-Object FullName, Length, LastWriteTimeUtc | ConvertTo-Json | Tee-Object -FilePath (Join-Path $diagnostics "heartbeat-metadata.json") | Write-Host
                Write-Host "Windows startup raw heartbeat:"
                Get-Content -LiteralPath $heartbeat.FullName -Raw -ErrorAction Continue | Write-Host
                Copy-Item -LiteralPath $heartbeat.FullName -Destination (Join-Path $diagnostics "heartbeat.txt") -ErrorAction Continue
              }
              Write-Host "Windows startup expected identity: executable=$expectedExecutable; sha256=$expectedSha256"
              $process.Refresh()
              Write-Host "Windows startup process: pid=$($process.Id); has_exited=$($process.HasExited)"
              if ($process.HasExited) { Write-Host "Windows startup exit_code=$($process.ExitCode)" }
              $diagnosticProcess = Get-Process -Id $process.Id -ErrorAction SilentlyContinue
              if ($null -ne $diagnosticProcess) {
                $diagnosticProcess | Select-Object Id, Path, StartTime, CPU, WorkingSet64, MainWindowHandle, MainWindowTitle, Responding | ConvertTo-Json | Tee-Object -FilePath (Join-Path $diagnostics "process.json") | Write-Host
              }
              Write-Host "Windows startup PowerShell version=$($PSVersionTable.PSVersion)"
            }
            catch {
              Write-Warning "Could not collect all Windows startup diagnostics: $($_.Exception.Message)"
            }
            Write-Host "Windows startup stdout:"
            Get-Content -LiteralPath $stdoutLog.FullName -Raw -ErrorAction Continue | Write-Host
            Write-Host "Windows startup stderr:"
            Get-Content -LiteralPath $log.FullName -Raw -ErrorAction Continue | Write-Host
            Copy-Item -LiteralPath $stdoutLog.FullName -Destination (Join-Path $diagnostics "stdout.log") -ErrorAction Continue
            Copy-Item -LiteralPath $log.FullName -Destination (Join-Path $diagnostics "stderr.log") -ErrorAction Continue
            Write-Host "Windows startup diagnostics retained: $diagnostics"
            throw $startupFailure
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Copy-Item -LiteralPath $stdoutLog.FullName -Destination (Join-Path $diagnostics "completed-stdout.log") -ErrorAction Continue
            Copy-Item -LiteralPath $log.FullName -Destination (Join-Path $diagnostics "completed-stderr.log") -ErrorAction Continue
            Copy-Item -LiteralPath $heartbeat.FullName -Destination (Join-Path $diagnostics "completed-heartbeat.txt") -ErrorAction Continue
          }

      - name: Upload failed Windows comparison payload
        if: failure() && steps.windows_startup_smoke.outcome == 'failure' && needs.preflight.outputs.version_bare == '0.22.42'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-comparison-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ./KatanA-windows-x86_64.zip
            tmp/identity-windows.json
          retention-days: 5

      - name: Trace failed packaged Windows startup
        if: failure() && steps.windows_startup_smoke.outcome == 'failure'
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/release/trace-windows-startup.ps1" -ExecutablePath (Join-Path $env:RUNNER_TEMP "katana-windows-smoke/KatanA.exe") -DiagnosticsDirectory "${{ steps.windows_startup_smoke.outputs.diagnostics_directory }}"

      - name: Upload Windows startup diagnostics
        if: always() && (steps.windows_startup_smoke.outcome == 'failure' || steps.windows_startup_smoke.outcome == 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-startup-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.windows_startup_smoke.outputs.diagnostics_directory }}
          if-no-files-found: error
          retention-days: 5

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-windows
          path: |
            KatanA-windows-x86_64.zip
            KatanA-windows-x86_64.msi

  windows_startup_comparison:
    name: Compare Windows packaged startup (Server 2022)
    needs: [preflight, build_windows]
    if: always() && needs.preflight.result == 'success' && needs.preflight.outputs.version_bare == '0.22.42' && needs.build_windows.outputs.startup_smoke_outcome == 'failure'
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Preserve source bytes for comparison provenance
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
      - name: Download failed Windows comparison payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-native-comparison-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}\windows-native-comparison-payload-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare original Windows startup smoke body
        shell: pwsh
        run: >-
          python scripts/release/prepare-windows-startup-comparison.py
          --payload-dir "${{ runner.temp }}\windows-native-comparison-payload-${{ github.run_id }}-${{ github.run_attempt }}"
          --workflow "$env:GITHUB_WORKSPACE\.github\workflows\build-and-release.yml"
          --current-root "$env:GITHUB_WORKSPACE"
          --output-script "${{ runner.temp }}\windows-native-startup-comparison.ps1"
          --output-metadata "${{ runner.temp }}\windows-native-startup-comparison.json"
          --expected-version "${{ needs.preflight.outputs.version }}"
          --expected-source-commit "${{ needs.preflight.outputs.commit_sha }}"
          --expected-run-id "${{ github.run_id }}"
          --expected-run-attempt "${{ github.run_attempt }}"
      - name: Run original Windows startup smoke on Server 2022
        id: windows_startup_comparison_smoke
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP "windows-native-comparison-payload-${{ github.run_id }}-${{ github.run_attempt }}"
          Set-Location -LiteralPath $payload
          $scriptPath = Join-Path $env:RUNNER_TEMP "windows-native-startup-comparison.ps1"
          $diagnostics = $null
          $heartbeat = $null
          $stdoutLog = $null
          $log = $null
          $originalFailure = $null
          $evidenceFailure = $null
          try {
            . $scriptPath
          }
          catch {
            $originalFailure = $_
          }
          finally {
            try {
              if ($null -ne $diagnostics -and (Test-Path -LiteralPath $diagnostics)) {
                if ($null -ne $heartbeat -and (Test-Path -LiteralPath $heartbeat.FullName)) {
                  Copy-Item -LiteralPath $heartbeat.FullName -Destination (Join-Path $diagnostics "heartbeat.txt") -Force -ErrorAction Stop
                }
                if ($null -ne $stdoutLog -and (Test-Path -LiteralPath $stdoutLog.FullName)) {
                  Copy-Item -LiteralPath $stdoutLog.FullName -Destination (Join-Path $diagnostics "stdout.log") -Force -ErrorAction Stop
                }
                if ($null -ne $log -and (Test-Path -LiteralPath $log.FullName)) {
                  Copy-Item -LiteralPath $log.FullName -Destination (Join-Path $diagnostics "stderr.log") -Force -ErrorAction Stop
                }
                foreach ($evidencePath in @("heartbeat.txt", "stdout.log", "stderr.log")) {
                  if (-not (Test-Path -LiteralPath (Join-Path $diagnostics $evidencePath))) {
                    throw "Comparison evidence file was not retained: $evidencePath"
                  }
                }
              } else {
                throw "Comparison diagnostics directory was not created"
              }
            }
            catch {
              $evidenceFailure = $_
              Write-Warning "Could not retain comparison startup evidence: $($_.Exception.Message)"
            }
          }
          if ($null -ne $originalFailure) { throw $originalFailure }
          if ($null -ne $evidenceFailure) { throw $evidenceFailure }
      - name: Capture Windows comparison host metadata
        if: always()
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP "windows-native-comparison-payload-${{ github.run_id }}-${{ github.run_attempt }}"
          $metadata = Join-Path $env:RUNNER_TEMP "windows-native-startup-comparison-host.json"
          $identity = Join-Path $env:RUNNER_TEMP "windows-native-startup-comparison.json"
          $smokeDirectory = Join-Path $env:RUNNER_TEMP "katana-windows-smoke"
          $executable = Join-Path $smokeDirectory "KatanA.exe"
          $worker = Join-Path $smokeDirectory "kdv-office-worker.exe"
          $os = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
          $executableIdentity = if (Test-Path -LiteralPath $executable) {
            $hash = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash
            [ordered]@{ path = $executable; sha256 = $hash; size = (Get-Item -LiteralPath $executable).Length }
          } else { $null }
          $workerIdentity = if (Test-Path -LiteralPath $worker) {
            $hash = (Get-FileHash -LiteralPath $worker -Algorithm SHA256).Hash
            [ordered]@{ path = $worker; sha256 = $hash; size = (Get-Item -LiteralPath $worker).Length }
          } else { $null }
          $record = [ordered]@{
            runner_os = $env:RUNNER_OS
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            os_caption = if ($null -ne $os) { $os.Caption } else { $null }
            os_version = if ($null -ne $os) { $os.Version } else { $null }
            github_run_id = $env:GITHUB_RUN_ID
            github_run_attempt = $env:GITHUB_RUN_ATTEMPT
            run_identity = "$env:GITHUB_RUN_ID/$env:GITHUB_RUN_ATTEMPT"
            parent_session_id = [Diagnostics.Process]::GetCurrentProcess().SessionId
            payload_directory = $payload
            identity_manifest = $identity
            executable_identity = $executableIdentity
            worker_identity = $workerIdentity
          }
          $record | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $metadata -Encoding utf8
      - name: Upload Windows comparison diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-comparison-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}\windows-native-startup-comparison.json
            ${{ runner.temp }}\windows-native-startup-comparison.ps1
            ${{ runner.temp }}\windows-native-startup-comparison-host.json
            ${{ steps.windows_startup_comparison_smoke.outputs.diagnostics_directory }}
          retention-days: 5

  publish:
    name: Publish Release
    needs: [preflight, build_macos, smoke_macos, build_linux, build_windows]
    if: always() && needs.preflight.result == 'success' && needs.build_macos.result == 'success' && needs.smoke_macos.result == 'success' && needs.build_linux.result == 'success' && needs.build_windows.result == 'success'
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.commit_sha }}
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: Normalize generated payload identity filenames
        if: needs.preflight.outputs.version_bare == '0.22.42'
        run: |
          for platform in macos linux windows; do
            mv "artifacts-identity-$platform/identity-$platform.json" "artifacts-identity-$platform/identity.json"
          done
      - name: Organize Artifacts
        run: ./scripts/release/collect-artifacts.sh release-files
      - name: Verify downloaded publication executable identities
        if: needs.preflight.outputs.version_bare == '0.22.42'
        run: |
          brew install sevenzip
          python3 -m venv tmp/release-evidence-python
          tmp/release-evidence-python/bin/python -m pip install --disable-pip-version-check --only-binary=:all: -r scripts/release/evidence-requirements.txt
          tmp/release-evidence-python/bin/python scripts/release/test-published-artifact-identity.py
          tmp/release-evidence-python/bin/python scripts/release/check-document-fidelity-release-gate.py "${{ needs.preflight.outputs.version_bare }}" automated-release --root .
          tmp/release-evidence-python/bin/python scripts/release/check-published-artifact-identity.py --root . --assets release-files --version "${{ needs.preflight.outputs.version }}" --scope automated-release --phase prepublish --build-manifests .

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.preflight.outputs.version }}"
          TITLE="KatanA Desktop ${TAG}"
          NOTES="release-notes/RELEASE_NOTES.md"
          FILES=(release-files/*)
          SHA="${{ needs.preflight.outputs.commit_sha }}"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "⚠️ Release $TAG already exists. Updating..."
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --target "$SHA"
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            echo "✨ Creating new release $TAG..."
            gh release create "$TAG" --title "$TITLE" --notes-file "$NOTES" --target "$SHA" "${FILES[@]}"
          fi

      - name: Attest Artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-files/*'

      - name: Sync External Registries
        if: success()
        env:
          HOMEBREW_KATANA_GIT_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          WINGET_GH_TOKEN: ${{ secrets.WINGET_GH_TOKEN }}
        run: |
          ./scripts/release/sync-external.sh \
            "${{ needs.preflight.outputs.version_bare }}" \
            "${{ needs.preflight.outputs.version }}" \
            "release-files"

      - name: Preserve external registry sync results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-registry-sync
          path: release-files/external-registry-sync.json
          if-no-files-found: warn

  cleanup_default:
    name: Audit and clean published release branches
    needs: [preflight, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: just,cargo-deny@0.20.2
          fallback: none
      - name: Install pinned cleanup tool
        run: cargo install cargo-sweep --version 0.8.0 --locked
      - name: Install normal hook dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh python3-venv clang lld libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev gcc pkg-config libdbus-1-dev mesa-vulkan-drivers vulkan-tools xvfb
          bun install --global lefthook@2.2.0
          docker compose version
          lefthook install
      - name: Resolve and clean the published target
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.preflight.outputs.version_bare }}
          PUBLISHED: ${{ needs.preflight.outputs.commit_sha }}
          SOURCE_PR: ${{ github.event.pull_request.number }}
        run: |
          PR_OPTIONS=()
          if [[ -n "$SOURCE_PR" ]]; then
            PR_OPTIONS=("--pull-request" "$SOURCE_PR")
          fi
          TARGET=$(python3 -B scripts/release/resolve-cleanup-target.py \
            --repository "$REPOSITORY" --version "$VERSION" --published "$PUBLISHED" "${PR_OPTIONS[@]}")
          BRANCH=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["branch"])' "$TARGET")
          EXPECTED=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["expected"])' "$TARGET")
          MERGE_COMMIT=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["merge_commit"])' "$TARGET")
          PULL_REQUEST=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["pull_request"])' "$TARGET")
          python3 -B scripts/release/run-release-cleanup.py \
            --root "$PWD" --controller "$PWD" --repository "$REPOSITORY" \
            --version "$VERSION" --branch "$BRANCH" --expected "$EXPECTED" --published "$PUBLISHED" \
            --merge-commit "$MERGE_COMMIT" --pull-request "$PULL_REQUEST" --remote
      - name: Preserve cleanup receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-release-cleanup-receipts
          path: .git/katana-cleanup-receipts/*.jsonl
          include-hidden-files: true
          if-no-files-found: error
