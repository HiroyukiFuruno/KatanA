name: Release Readiness

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-check:
    name: Release Readiness
    # WHY: 公開準備検査はReady for review後だけ実行し、Draftを副作用なく保留する。
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - name: Install release validation tools
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2,cargo-llvm-cov@0.9.1
          fallback: none
      - name: Install native hook contract tools
        run: brew install lefthook just
      - name: Run PR readiness check
        # WHY: check-pr-ready が preflight を内包するため、同じ公開検査を二重実行しない。
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_HEAD_REF}" == release/* ]]; then
            version="${GITHUB_HEAD_REF#release/v}"
            version="${version%%-*}"
          else
            version="$(cat Cargo.toml | awk -F'\"' '/^version = / {print $2}')"
          fi

          if [[ "${GITHUB_HEAD_REF}" == release/v0.22.42-public-release-evidence ]]; then
            ./scripts/release/check-pr-ready.sh "$version" --post-release-automated
          elif [[ "${GITHUB_HEAD_REF}" == release/v0.22.43-public-release-evidence && "$version" == "0.22.43" ]]; then
            ./scripts/release/check-pr-ready.sh "$version" --post-release-evidence
          elif [[ "${GITHUB_HEAD_REF}" == release/v0.22.44-public-release-evidence && "$version" == "0.22.44" ]]; then
            ./scripts/release/check-pr-ready.sh "$version" --post-release-evidence
          elif [[ "${GITHUB_HEAD_REF}" == release/v0.22.46-public-release-evidence && "$version" == "0.22.46" ]]; then
            ./scripts/release/check-pr-ready.sh "$version" --post-release-evidence
          elif [[ "${GITHUB_HEAD_REF}" == docs/v*-public-release-evidence ]]; then
            ./scripts/release/check-pr-ready.sh "$version" --post-release-evidence
          elif [[ "$version" == "0.22.42" ]]; then
            ./scripts/release/check-pr-ready.sh "$version" --automated-release
          else
            ./scripts/release/check-pr-ready.sh "$version" --pr-bootstrap
          fi
      - name: Install published artifact validation tools
        if: github.head_ref == 'release/v0.22.42-public-release-evidence'
        run: brew install sevenzip
      - name: Verify actual published release artifacts
        if: github.head_ref == 'release/v0.22.42-public-release-evidence'
        id: actual_published_artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_commit="$(gh api repos/HiroyukiFuruno/KatanA/commits/v0.22.42 --jq .sha)"
          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid published tag commit" >&2; exit 1; }
          echo "Verification controller: $GITHUB_SHA; published artifact source: $tag_commit"
          python3 -B scripts/release/test-published-git-source.py
          python3 -B scripts/release/test-postpublication-controller-scope.py
          python3 -B scripts/release/test-postpublication-run-admission.py
          python3 -B scripts/release/test-postpublication-source-binding.py
          work="$(mktemp -d "${RUNNER_TEMP}/katana-post-release.XXXXXX")"
          selection="$(python3 -B scripts/release/postpublication_run_admission.py --repository HiroyukiFuruno/KatanA --source "$tag_commit" --version v0.22.42 --output "$work/run-admission.json")"
          echo "admission_path=$work/run-admission.json" >> "$GITHUB_OUTPUT"
          read -r build_run build_attempt build_sha <<< "$selection"
          [[ "$build_run" =~ ^[1-9][0-9]*$ && "$build_attempt" =~ ^[1-9][0-9]*$ && "$build_sha" == "$tag_commit" ]] || { echo "Published tag has no verified successful build run" >&2; exit 1; }
          gh run download "$build_run" --repo HiroyukiFuruno/KatanA --dir "$work/manifests" --name artifacts-identity-macos --name artifacts-identity-linux --name artifacts-identity-windows
          for platform in macos linux windows; do
            mv "$work/manifests/artifacts-identity-$platform/identity-$platform.json" "$work/manifests/artifacts-identity-$platform/identity.json"
          done
          python3 - "$work/manifests" "$build_run" "$build_attempt" "$tag_commit" <<'PY'
          import json
          from pathlib import Path
          import sys
          root, build_run, build_attempt, tag_commit = sys.argv[1:]
          for platform in ("macos", "linux", "windows"):
              record = json.loads((Path(root) / f"artifacts-identity-{platform}/identity.json").read_text())
              if (record.get("github_run_id"), record.get("github_run_attempt"), record.get("provenance", {}).get("source_commit")) != (build_run, build_attempt, tag_commit):
                  raise SystemExit("Published manifest differs from its actual tag/run/attempt")
          PY
          echo "Published artifact build: tag=v0.22.42 commit=$tag_commit run=$build_run attempt=$build_attempt"
          tmp/release-evidence-python/bin/python scripts/release/check-published-artifact-identity.py --root . --assets "$work/assets" --version v0.22.42 --scope automated-release --phase postpublication --build-manifests "$work/manifests"
      - name: Preserve published run admission
        if: always() && github.head_ref == 'release/v0.22.42-public-release-evidence' && steps.actual_published_artifacts.outputs.admission_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-run-admission
          path: ${{ steps.actual_published_artifacts.outputs.admission_path }}
          if-no-files-found: error

  published-asset-identity:
    name: Verify published asset identity
    # WHY: 元のDraft/PR検査には触れず、完了した同一repoのrelease runだけを別の読取専用jobで検査する。
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'release/v')) ||
       (github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.head_branch == 'master'))
    runs-on: macos-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Install publication identity tools
        run: brew install sevenzip
      - name: Verify finished publication identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
          BUILD_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          python3 -B scripts/release/check-generated-artifact-identity.py --root . --phase postpublication --run-id "$BUILD_RUN" --run-attempt "$BUILD_ATTEMPT" --work "$RUNNER_TEMP/published-identity-$BUILD_RUN-$BUILD_ATTEMPT"
      - name: Preserve publication identity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-asset-identity
          path: |
            ${{ runner.temp }}/published-identity-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}/run-admission.json
            ${{ runner.temp }}/published-identity-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}/publication-identity.json
            ${{ runner.temp }}/published-identity-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}/manifests/
          if-no-files-found: error
