name: Release Readiness

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-check:
    name: Release Readiness
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Install cargo-deny
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Run PR readiness check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_HEAD_REF}" == release/* ]]; then
            version="${GITHUB_HEAD_REF#release/v}"
            version="${version%%-*}"
          else
            version="$(cat Cargo.toml | awk -F'\"' '/^version = / {print $2}')"
          fi

          if [[ "${GITHUB_HEAD_REF}" == docs/v*-public-release-evidence ]]; then
            ./scripts/release/check-pr-ready.sh "$version" --post-release-evidence
          else
            ./scripts/release/check-pr-ready.sh "$version" --pr-bootstrap
          fi
