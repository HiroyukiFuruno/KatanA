[package]
name = "katana-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "KatanA UI: egui application shell, panes, menu wiring, and presentation state"

[features]
# Exposes the narrow inspection hook consumed by the external screenshot harness.
screenshot-test-hooks = []
# Compiles acceptance tests for explicitly supplied, non-repository fixtures.
external-fixture-acceptance = []

[dependencies]
katana-core = { version = "0.22.39", path = "../katana-core" }
katana-platform = { version = "0.22.39", path = "../katana-platform" }
katana-document-viewer.workspace = true
katana-markdown-linter.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
egui_commonmark.workspace = true
serde.workspace = true
anyhow.workspace = true
parking_lot = "0.12"
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
serde_json.workspace = true
open = "5.4.4"
resvg = { version = "0.48.1", default-features = true }
ehttp = { version = "0.7.1", features = ["streaming"] }
dirs = "7.0.0"
sha2 = "0.11"
regex = "1.13.1"
chrono = "0.4.45"
tempfile = "3"
pulldown-cmark = "0.13"
base64 = "0.23.1"
mathjax_svg.workspace = true
unicode-segmentation = "1.13.3"
arboard = "3.6.1"
uuid = { version = "1.26.1", features = ["v4"] }
egui-file-dialog = "0.15.0"
notify.workspace = true
url.workspace = true
skrifa = { version = "0.47.0", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
winres = "0.1"

[[bin]]
name = "KatanA"
path = "src/main.rs"

[[bin]]
name = "kdv-office-worker"
path = "src/bin/kdv-office-worker.rs"

[package.metadata.bundle.bin.KatanA]
name = "KatanA Desktop"
identifier = "com.github.hiroyukifuruno.katana"
icon = ["../../assets/icon.icns"]
copyright = "Copyright © 2026 Hiroyuki Furuno"
category = "public.app-category.developer-tools"
short_description = "A fast, lightweight Markdown workspace for macOS"

[dev-dependencies]
egui_kittest = { version = "=0.36.2", features = ["snapshot", "wgpu", "eframe"] }
time = "0.3"
