# lefthook.yml
no_tty: true
output:
  - failure

pre-commit:
  parallel: false
  commands:
    release-branch-policy:
      run: scripts/release/assert-release-work-branch.sh
    formatting:
      run: just fmt
    biome-js-lint:
      glob: "*.{js,ts}"
      run: just biome-js-lint
    clippy:
      glob: "{crates,vendor}/**/*.{rs,toml,lock}"
      run: just lint-impacted
    ast-lint:
      glob: "{crates,vendor}/**/*.{rs,toml,lock}"
      run: just ast-lint

commit-msg:
  commands:
    issue-reference:
      run: bash scripts/release/check-commit-issue-reference.sh {1}

# WHY: 版や依存情報が不整合なら、重い検査の開始前にpushを失敗させる。
pre-push:
  parallel: false
  piped: true
  commands:
    pr-ready-check:
      priority: 1
      run: ./scripts/release/check-pr-ready.sh --pr-bootstrap
      only:
        - ref: master
        - ref: release/*
    check-strict:
      priority: 2
      run: python3 scripts/release/run-owned-push-check.py
      glob:
        - "Cargo.{toml,lock}"
        - "**/Cargo.{toml,lock}"
        - "{crates,vendor}/**/*.{rs,toml,lock}"
        - "scripts/*.{py,sh}"
        - "scripts/**/*.{py,sh,rs,toml,lock}"
        - "just/*.just"
        - "Justfile"
        - "lefthook.yml"
        - ".cargo/*.toml"
        - "rust-toolchain.toml"
      only:
        - ref: master
        - ref: release/*

    check-light:
      priority: 3
      run: just check-light
      glob: "{crates,vendor}/**/*.{rs,toml,lock}"
      skip:
        - ref: master
        - ref: release/*

pre-pr:
  commands:
    validation:
      run: ./scripts/release/check-pr-ready.sh --pr-bootstrap
